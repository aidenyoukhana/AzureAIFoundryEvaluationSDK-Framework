name: "AI Evaluation"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        evaluator: 
          - name: qa
            data: qa_data.jsonl
    env:
      GENAI_EVALS_CONFIG_PATH: ${{ github.workspace }}/evaluate-config-${{ matrix.evaluator.name }}.json
      GENAI_EVALS_DATA_PATH: ${{ github.workspace }}/data/general_purpose/${{ matrix.evaluator.data }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Write evaluate config
        run: |
          evaluator_name="${{ matrix.evaluator.name }}"

          if [ "$evaluator_name" = "qa" ]; then
            evaluator_class="QAEvaluator"
            column_mapping='"column_mapping": {"question": "input", "answer": "response", "ground_truth": "ground_truth", "context": "context"},'
          elif [ "$evaluator_name" = "coherence" ]; then
            evaluator_class="CoherenceEvaluator"
            column_mapping=""
          elif [ "$evaluator_name" = "fluency" ]; then
            evaluator_class="FluencyEvaluator"
            column_mapping=""
          fi

          cat > ${{ env.GENAI_EVALS_CONFIG_PATH }} <<EOF
          {
            "data": "${{ env.GENAI_EVALS_DATA_PATH }}",
            "evaluators": {
              "$evaluator_name": {
                "class": "$evaluator_class",
                $column_mapping
                "metrics": ["accuracy"]
              }
            },
            "ai_model_configuration": {
              "type": "azure_openai",
              "azure_endpoint": "${{ secrets.AZURE_OPENAI_ENDPOINT }}",
              "azure_deployment": "${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}",
              "api_key": "${{ secrets.AZURE_OPENAI_API_KEY }}",
              "api_version": "${{ secrets.AZURE_OPENAI_API_VERSION }}"
            }
          }
          EOF

      - name: Run AI Evaluation
        id: run-ai-evaluation
        uses: microsoft/genai-evals@main
        with:
          evaluate-configuration: ${{ env.GENAI_EVALS_CONFIG_PATH }}
